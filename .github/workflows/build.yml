name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore AutoExtracter.csproj
      - name: Build
        run: dotnet build AutoExtracter.csproj --configuration Release --no-restore
